<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYWAY.GAVG // OFFICIAL MEMBERS ROSTER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #030203;
            color: #ffffff;
            padding: 16px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* พื้นหลังแสงเหนือเคลื่อนไหวโทนแดงดำระดับโปร */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #030203, #1c0508, #030203, #2e080e);
            background-size: 400% 400%;
            animation: auroraAnimation 12s ease infinite;
        }

        @keyframes auroraAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* เฮดเดอร์บนสุด */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 30, 60, 0.3);
            background: rgba(14, 10, 12, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 18px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .logo-text {
            color: #ff1e3c;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 30, 60, 0.8);
        }
        .nav-btns {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(20, 10, 12, 0.9);
            color: #ffd1d6;
            border: 1px solid rgba(255, 30, 60, 0.4);
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 0.65rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .btn:hover {
            border-color: #ff738a;
            background: rgba(255, 30, 60, 0.25);
            box-shadow: 0 0 20px rgba(255, 30, 60, 0.5);
        }
        .btn:active {
            transform: scale(0.93);
            background: #ff1e3c;
            color: #030203;
        }

        /* หัวข้อหลักตรงกลาง */
        .main-title-container {
            text-align: center;
            margin: 20px 0 30px 0;
            position: relative;
        }
        .main-title-container::after {
            content: '';
            display: block;
            width: 120px;
            height: 2px;
            background: #ff1e3c;
            margin: 12px auto 0 auto;
            box-shadow: 0 0 10px #ff1e3c;
        }
        .main-title {
            color: #ff1e3c;
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(255, 30, 60, 0.7), 0 0 10px rgba(255, 30, 60, 0.4);
            margin-bottom: 4px;
        }
        .sub-title {
            color: #9c7b82;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        /* หัวข้อหมวดหมู่ยศ */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ff1e3c;
            margin: 32px 0 12px 0;
            font-size: 0.9rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 30, 60, 0.3);
            padding-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 30, 60, 0.5);
        }
        .section-title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .count-badge {
            font-size: 0.7rem;
            color: #ffd1d6;
            border: 1px solid rgba(255, 30, 60, 0.35);
            background: rgba(20, 10, 12, 0.85);
            padding: 3px 9px;
            border-radius: 8px;
            box-shadow: inset 0 0 8px rgba(255, 30, 60, 0.2);
        }

        /* รายการการ์ดสมาชิก */
        .member-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .member-card {
            background: rgba(14, 10, 12, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 30, 60, 0.3);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 30, 60, 0.05);
            transition: all 0.25s ease;
        }
        .member-card:hover {
            border-color: #ff738a;
            box-shadow: 0 0 30px rgba(255, 30, 60, 0.4), inset 0 0 20px rgba(255, 30, 60, 0.15);
            transform: translateY(-2px);
        }
        .member-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        /* รูปโปรไฟล์และตราสัญลักษณ์ยศลอยตัว */
        .avatar-container {
            position: relative;
            width: 52px;
            height: 52px;
        }
        .member-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #ff1e3c;
            object-fit: cover;
            box-shadow: 0 0 12px rgba(255, 30, 60, 0.6);
        }
        .rank-insignia {
            position: absolute;
            top: -6px;
            left: -5px;
            background: #140a0c;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: #ffd1d6;
            border: 1px solid #ff1e3c;
            box-shadow: 0 0 8px rgba(255, 30, 60, 0.9);
            z-index: 2;
        }

        .member-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .member-name {
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }
        .member-role {
            display: inline-block;
            background: rgba(255, 30, 60, 0.15);
            color: #ffd1d6;
            border: 1px solid rgba(255, 30, 60, 0.4);
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            width: fit-content;
            box-shadow: 0 0 8px rgba(255, 30, 60, 0.2);
        }

        /* ปุ่มโซเชียลขอบแดงสุดพรีเมียม */
        .social-icon-btn {
            width: 40px;
            height: 40px;
            background: rgba(20, 10, 12, 0.9);
            border: 1px solid rgba(255, 30, 60, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd1d6;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        .social-icon-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffd1d6;
            transition: 0.2s;
        }
        .social-icon-btn:hover {
            background: #ff1e3c;
            border-color: #fff;
            box-shadow: 0 0 25px rgba(255, 30, 60, 0.9);
            transform: scale(1.05);
        }
        .social-icon-btn:hover svg {
            fill: #030203;
        }

        .empty-slot {
            text-align: center;
            padding: 18px;
            background: rgba(14, 10, 12, 0.5);
            border: 1px dashed rgba(255, 30, 60, 0.3);
            border-radius: 14px;
            color: #9c7b82;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
        }
    </style>
