<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYWAY // WORLD CLASS DESIGN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020202;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* แสงออร่าพื้นหลังแบบไดนามิก */
        .ambient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(35, 4, 10, 0.8) 0%, rgba(1, 1, 1, 0.99) 75%);
        }

        .spotlight {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            height: 380px;
            background: rgba(255, 10, 30, 0.18);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.85; }
        }

        /* ส่วนหัวเว็บไซต์ */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #ff1e3c;
            font-weight: 900;
            text-shadow: 0 0 12px rgba(255, 30, 60, 0.8);
        }

        .nav-btn {
            background: rgba(20, 10, 15, 0.6);
            border: 1px solid rgba(255, 30, 60, 0.4);
            color: #ffe6eb;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-decoration: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 30, 60, 0.25);
            border-color: #ff738a;
            box-shadow: 0 0 15px rgba(255, 30, 60, 0.5);
        }

        /* บล็อกกลางหน้าจอ */
        .center-wrapper {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        /* โลโก้ */
        .hero-container {
            margin-bottom: 35px;
            width: 100%;
        }

        .gothic-logo-text {
            font-size: clamp(3.5rem, 12vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-transform: uppercase;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.7), 
                         0 0 50px rgba(255, 30, 60, 0.6),
                         0 0 90px rgba(255, 30, 60, 0.4);
            animation: logoFloat 4s ease-in-out infinite alternate;
            margin-bottom: 4px;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-6px) scale(1.02); }
        }

        .hero-subtitle {
            color: #a8828b;
            font-size: 0.65rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
        }

        /* ปุ่มกดระดับไฮเทคพร้อมอนิเมชันหล่นลงมา */
        .center-action {
            width: 100%;
            display: flex;
            justify-content: center;
            animation: dropDownBtn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropDownBtn {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .enter-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 30, 60, 0.15) 0%, rgba(138, 0, 20, 0.4) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #ffffff;
            border: 1.5px solid rgba(255, 60, 90, 0.6);
            padding: 16px 48px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-decoration: none;
            overflow: hidden;
            display: inline-block;
            box-shadow: 0 10px 35px rgba(255, 30, 60, 0.4), 
                        inset 0 0 15px rgba(255, 30, 60, 0.3);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            animation: cyberPulse 3s infinite 1.2s;
        }

        /* แสงเลเซอร์วิ่งผ่านปุ่ม (Laser Sweep) */
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-20deg);
            transition: 0.7s ease-in-out;
        }

        .enter-btn:hover::before {
            left: 150%;
        }

        /* ขอบเรืองแสงสไตล์ไฮเทคตอนเอาเมาส์ชี้ */
        .enter-btn:hover {
            background: linear-gradient(135deg, rgba(255, 30, 60, 0.4) 0%, rgba(200, 0, 30, 0.7) 100%);
            border-color: #ffffff;
            transform: scale(1.08) translateY(-4px);
            box-shadow: 0 0 30px rgba(255, 30, 60, 0.9), 
                        0 0 60px rgba(255, 30, 60, 0.5),
                        inset 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        @keyframes cyberPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 30, 60, 0.6), inset 0 0 15px rgba(255, 30, 60, 0.3); }
            70% { box-shadow: 0 0 0 18px rgba(255, 30, 60, 0), inset 0 0 25px rgba(255, 30, 60, 0.6); }
            100% { box-shadow: 0 0 0 0 rgba(255, 30, 60, 0), inset 0 0 15px rgba(255, 30, 60, 0.3); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="spotlight"></div>

    <header>
        <div class="header-title">MYWAY.GAVG</div>
        <div class="nav-links">
            <a href="roster.html" class="nav-btn">ROSTER</a>
        </div>
    </header>

    <div class="center-wrapper">
        <div class="hero-container">
            <div class="gothic-logo-text">MYWAY</div>
            <div class="hero-subtitle">THE OFFICIAL SUPREMACY</div>
        </div>

        <div class="center-action">
            <a href="roster.html" class="enter-btn">ENTER ROSTER</a>
        </div>
    </div>

</body>
</html>
