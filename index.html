<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYWAY // WORLD CLASS DESIGN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020202;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* แสงออร่าพื้นหลัง */
        .ambient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(30, 5, 8, 0.7) 0%, rgba(2, 2, 2, 0.98) 70%);
        }

        .spotlight {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: rgba(255, 20, 40, 0.15);
            filter: blur(90px);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        /* ส่วนหัวเว็บไซต์ (ให้อยู่มุมบนสุดแบบอิสระ) */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #ff1e3c;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 30, 60, 0.6);
        }

        .nav-btn {
            background: rgba(15, 10, 12, 0.8);
            border: 1px solid rgba(255, 30, 60, 0.35);
            color: #ffd1d6;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        /* บล็อกกลางหน้าจอแบบเป๊ะๆ 100% ไม่โดนบาร์มือถือดัน */
        .center-wrapper {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        /* โลโก้ */
        .hero-container {
            margin-bottom: 30px;
            width: 100%;
        }

        .gothic-logo-text {
            font-size: clamp(3.5rem, 12vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 
                         0 0 50px rgba(255, 30, 60, 0.5);
            animation: logoFloat 4s ease-in-out infinite alternate;
            margin-bottom: 4px;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-6px) scale(1.02); }
        }

        .hero-subtitle {
            color: #9c7b82;
            font-size: 0.65rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        }

        /* ปุ่มกดเอฟเฟกต์หล่นลงมาจากด้านบนเข้าสู่กลางจอ */
        .center-action {
            width: 100%;
            display: flex;
            justify-content: center;
            animation: dropDownBtn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropDownBtn {
            0% {
                transform: translateY(-90px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .enter-btn {
            position: relative;
            background: linear-gradient(135deg, #ff1e3c 0%, #8a0014 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 16px 48px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-decoration: none;
            overflow: hidden;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(255, 30, 60, 0.6), 
                        inset 0 2px 6px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: btnPulse 2.5s infinite 1.2s;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }

        .enter-btn:hover::before {
            left: 100%;
        }

        .enter-btn:hover {
            transform: scale(1.08) translateY(-4px);
            box-shadow: 0 15px 45px rgba(255, 30, 60, 0.9), 
                        inset 0 2px 10px rgba(255, 255, 255, 0.6);
            border-color: #ffffff;
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 30, 60, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 30, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 30, 60, 0); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="spotlight"></div>

    <header>
        <div class="header-title">MYWAY.GAVG</div>
        <div class="nav-links">
            <a href="roster.html" class="nav-btn">ROSTER</a>
        </div>
    </header>

    <!-- จัดกึ่งกลางหน้าจอแบบเด็ดขาด ปุ่มจะหล่นมาอยู่ตรงกลางพอดีเป๊ะ -->
    <div class="center-wrapper">
        <div class="hero-container">
            <div class="gothic-logo-text">MYWAY</div>
            <div class="hero-subtitle">THE OFFICIAL SUPREMACY</div>
        </div>

        <div class="center-action">
            <a href="roster.html" class="enter-btn">ENTER ROSTER</a>
        </div>
    </div>

</body>
</html>
