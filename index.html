<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYWAY.com</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020202;
            color: #ffffff;
            height: 100vh;
            height: 100dvh; /* ป้องกันปัญหาจอมือถือโดนแถบบราวน์เซอร์บัง */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* แสงออร่าพื้นหลัง */
        .ambient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(30, 5, 8, 0.7) 0%, rgba(2, 2, 2, 0.98) 70%);
        }

        .spotlight {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: rgba(255, 20, 40, 0.15);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        /* ส่วนหัวเว็บไซต์ */
        header {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #ff1e3c;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 30, 60, 0.6);
        }

        .nav-btn {
            background: rgba(15, 10, 12, 0.8);
            border: 1px solid rgba(255, 30, 60, 0.35);
            color: #ffd1d6;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        /* ส่วนเนื้อหาหลักตรงกลาง (จัดให้กระชับ ไม่กินพื้นที่) */
        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            flex-grow: 1;
        }

        .gothic-logo-text {
            font-size: clamp(3.2rem, 11vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 
                         0 0 40px rgba(255, 30, 60, 0.5);
            animation: logoFloat 4s ease-in-out infinite alternate;
            margin-bottom: 2px;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-6px) scale(1.02); }
        }

        .hero-subtitle {
            color: #9c7b82;
            font-size: 0.65rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        }

        /* ส่วนปุ่มกดด้านล่าง ดึงให้อยู่ในหน้าจอพอดี */
        .footer-action {
            width: 100%;
            padding: 20px 20px 35px 20px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .enter-btn {
            position: relative;
            background: linear-gradient(135deg, #ff1e3c 0%, #8a0014 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 14px 40px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(255, 30, 60, 0.6), 
                        inset 0 2px 5px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: btnPulse 2.5s infinite;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }

        .enter-btn:hover::before {
            left: 100%;
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 30, 60, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(255, 30, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 30, 60, 0); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="spotlight"></div>

    <header>
        <div class="header-title">MYWAY.GAVG</div>
        <div class="nav-links">
            <a href="roster.html" class="nav-btn">ROSTER</a>
        </div>
    </header>

    <div class="hero-container">
        <div class="gothic-logo-text">MYWAY</div>
        <div class="hero-subtitle">THE OFFICIAL SUPREMACY</div>
    </div>

    <!-- ปุ่ม ENTER ROSTER จะเด้งขึ้นมาโชว์เด่นชัดบนหน้าจอมือถือทันที -->
    <div class="footer-action">
        <a href="roster.html" class="enter-btn">ENTER ROSTER</a>
    </div>

</body>
</html>
