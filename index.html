<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYWAY // WORLD CLASS DESIGN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020202;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(30, 5, 8, 0.6) 0%, rgba(2, 2, 2, 0.95) 70%);
        }

        .spotlight {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background: rgba(255, 20, 40, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
        }

        header {
            width: 100%;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #ff1e3c;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 30, 60, 0.6);
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: rgba(15, 10, 12, 0.8);
            border: 1px solid rgba(255, 30, 60, 0.35);
            color: #ffd1d6;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .nav-btn:hover {
            background: rgba(255, 30, 60, 0.2);
            border-color: #ff738a;
            box-shadow: 0 0 20px rgba(255, 30, 60, 0.5);
            transform: translateY(-2px);
        }

        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            margin-top: -40px;
        }

        .logo-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .main-logo {
            max-width: 280px;
            width: 80vw;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 30, 60, 0.5)) drop-shadow(0 0 5px rgba(255, 255, 255, 0.4));
            animation: logoFloat 5s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-8px) scale(1.02); }
        }

        .hero-subtitle {
            color: #9c7b82;
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .footer-action {
            width: 100%;
            padding: 30px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .enter-btn {
            background: linear-gradient(135deg, #ff1e3c, #b3001b);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 38px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(255, 30, 60, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .enter-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 30, 60, 0.8), inset 0 2px 8px rgba(255, 255, 255, 0.5);
        }

        .enter-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="spotlight"></div>

    <header>
        <div class="header-title">MYWAY.GAVG</div>
        <div class="nav-links">
            <a href="roster.html" class="nav-btn">ROSTER</a>
        </div>
    </header>

    <div class="hero-container">
        <div class="logo-wrapper">
            <!-- เปลี่ยนตรงนี้ให้ตรงกับชื่อไฟล์รูปของคุณ เช่น logo.png หรือถ้าไฟล์ชื่ออื่นให้แก้ตรงคำว่า logo.png ครับ -->
            <img src="logo.png" alt="MYWAY Logo" class="main-logo" onerror="this.src='https://via.placeholder.com/280x100/020202/ff1e3c?text=MYWAY';">
        </div>
        <div class="hero-subtitle">THE OFFICIAL SUPREMACY</div>
    </div>

    <div class="footer-action">
        <a href="roster.html" class="enter-btn">ENTER ROSTER</a>
    </div>

</body>
</html>
