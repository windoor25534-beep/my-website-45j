<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYWAY.GAVG // SUPREME EMPIRE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #030203;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* พื้นหลังแสงเหนือเคลื่อนไหวโทนแดงดำระดับโปร */
        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #030203, #1c0508, #030203, #2e080e);
            background-size: 400% 400%;
            animation: auroraAnimation 12s ease infinite;
        }

        @keyframes auroraAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* กล่องหลัก Glassmorphism ขอบแสงนีออนสีแดง */
        .wrapper {
            width: 100%;
            max-width: 440px;
            padding: 45px 30px;
            background: rgba(14, 10, 12, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 30, 60, 0.4);
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 
                        0 0 50px rgba(255, 30, 60, 0.2),
                        inset 0 0 25px rgba(255, 30, 60, 0.05);
            position: relative;
            text-align: center;
            overflow: hidden;
            animation: floatBox 5s ease-in-out infinite;
        }

        @keyframes floatBox {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* แสงสะท้อนพาดผ่านกล่อง */
        .wrapper::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                0deg,
                transparent,
                rgba(255, 30, 60, 0.04),
                transparent
            );
            transform: rotate(45deg);
            pointer-events: none;
            animation: shineEffect 6s linear infinite;
        }

        @keyframes shineEffect {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }

        .badge-top {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 30, 60, 0.1);
            color: #ff859b;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 4px;
            padding: 7px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 30, 60, 0.4);
            margin-bottom: 25px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 30, 60, 0.2);
        }

        /* จัดวางตัวอักษรชื่อแก๊งให้คมชัดและทรงพลัง */
        .main-title {
            color: #ffffff;
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(255, 30, 60, 0.7), 0 0 50px rgba(255, 30, 60, 0.4);
            margin-bottom: 6px;
            text-transform: lowercase; /* คงฟอร์มตามที่ต้องการ */
        }

        .sub-title {
            color: #9c7b82;
            font-size: 0.75rem;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .gang-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #d1b3b8;
            font-size: 0.7rem;
            margin-bottom: 35px;
            letter-spacing: 2px;
            background: rgba(20, 10, 12, 0.7);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 30, 60, 0.25);
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #ff1e3c;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff1e3c;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        /* ปุ่มกดดีไซน์พรีเมียมเรืองแสงสีแดง */
        .enter-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #24090d 0%, #080203 100%);
            border: 2px solid #ff1e3c;
            color: #ffffff;
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 
                        inset 0 0 20px rgba(255, 30, 60, 0.15);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .enter-btn:hover {
            border-color: #ff738a;
            box-shadow: 0 0 35px rgba(255, 30, 60, 0.7), 
                        inset 0 0 25px rgba(255, 30, 60, 0.3);
            transform: translateY(-3px);
        }

        .enter-btn:active {
            transform: scale(0.95) translateY(1px);
            background: #ff1e3c;
            box-shadow: 0 0 30px rgba(255, 30, 60, 0.9);
        }

        .btn-text {
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 4px;
            color: #ffd1d6;
            text-shadow: 0 0 12px rgba(255, 30, 60, 0.8);
            transition: 0.2s;
        }

        .enter-btn:active .btn-text {
            color: #030203;
            text-shadow: none;
        }

        .btn-subtext {
            font-size: 0.65rem;
            color: #9c7b82;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .enter-btn:active .btn-subtext {
            color: #222;
        }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <div class="wrapper">
        <div class="badge-top">
            <span>🔥</span> ELITE SANCTUARY <span>🔥</span>
        </div>
        
        <div class="main-title">Myway.gavg</div>
        <div class="sub-title">THE SUPREME EMPIRE</div>
        
        <div class="gang-info">
            <span class="dot"></span>
            <span>SECURE MEMBER ARCHIVES</span>
            <span class="dot"></span>
        </div>

        <a href="roster.html" class="enter-btn">
            <div class="btn-text">ENTER ROSTER</div>
            <div class="btn-subtext">[ TAP TO UNLOCK ]</div>
        </a>
    </div>

</body>
</html>
